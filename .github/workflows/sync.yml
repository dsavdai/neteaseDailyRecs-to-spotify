name: Sync NetEase Daily Recommendations
# Scheduled workflow kept on the default branch for daily execution.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run matching tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_spotify_matching.py

      - name: Run sync
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
          NETEASE_COOKIE: ${{ secrets.NETEASE_COOKIE }} 
        run: python -m src.main

      - name: Create issue when sync fails
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `NetEase → Spotify 同步失败（运行 #${context.runNumber}）`,
              body: `本次自动同步失败。

              GitHub Actions 运行链接：
              ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
